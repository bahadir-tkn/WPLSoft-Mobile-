name: Web ve PWA Yayını (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodları al
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps

      - name: GitHub Pages yapılandır
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Web uygulamasını derle
        shell: bash
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          export VITE_BASE_PATH="${BASE%/}/"
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Pages paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
